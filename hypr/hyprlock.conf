###############################################################################
# Gruvbox Hyprlock Config
# Tested & working on Hyprlock v0.8.x
###############################################################################

### ─────────────────────────────────────────────
### Gruvbox Color Palette
### ─────────────────────────────────────────────

$bg_dark        = rgba(282828ff)
$bg_light       = rgba(3c3836ff)

$fg_light       = rgba(ebdbb2ff)    # light text
$fg_dark        = rgba(928374ff)    # muted text

$red            = rgba(cc241dff)
$green          = rgba(98971aff)
$yellow         = rgba(d79921ff)
$blue           = rgba(458588ff)
$purple         = rgba(b16286ff)
$aqua           = rgba(689d6aff)
$orange         = rgba(d65d0eff)

$border_active   = $yellow
$border_inactive = $bg_light


### ─────────────────────────────────────────────
### General
### ─────────────────────────────────────────────
general {
    hide_cursor = 1
}


### ─────────────────────────────────────────────
### Background
### ─────────────────────────────────────────────
# You can use an image OR a blur-only background.
# Replace the path below with your own wallpaper path.

background {
    monitor =
    path = ~/.dotfiles/wallpapers/gruvbox-dark-blue.png
    blur_passes = 1
    blur_size = 8

    noise = 0.015
    contrast = 0.90
    brightness = 0.52
    vibrancy = 0.17
    vibrancy_darkness = 0.0
}


### ─────────────────────────────────────────────
### Time Display
### ─────────────────────────────────────────────
label {
    monitor =
    text = $TIME
    color = $fg_light
    font_size = 110
    font_family = CaskaydiaCove Nerd Font
    position = 0, -200
    halign = center
    valign = center
}


### ─────────────────────────────────────────────
### Input Field (Password box)
### ─────────────────────────────────────────────
input-field {
    monitor =
    size = 260, 60
    outline_thickness = 3

    outer_color = $border_inactive
    inner_color = $bg_dark
    font_color  = $fg_light
    check_color = $green
    fail_color  = $red

    dots_size = 0.33
    dots_spacing = 0.18
    dots_center = false
    dots_rounding = -1

    hide_input = false
    fade_on_empty = true
    fade_timeout = 900

    rounding = 12

    placeholder_text = <i>••••••••</i>

    position = 0, 50
    halign = center
    valign = center
}


### ─────────────────────────────────────────────
### Keyboard Layout Indicator
### ─────────────────────────────────────────────
label {
    monitor =
    text = $LAYOUT
    color = $fg_dark
    font_size = 16
    font_family = CaskaydiaCove Nerd Font
    position = 0, 320
    halign = center
    valign = center
}
